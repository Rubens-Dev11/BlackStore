# ClamAV pour BlackStore : configuration de l'image officielle clamav/clamav,
# plus des limites adaptées aux fichiers des vendeurs (450 Mo au plus).

LogFile /var/log/clamav/clamd.log
LogTime yes
LocalSocket /tmp/clamd.sock
TCPSocket 3310
User clamav

# Analyser les fichiers en entier jusqu'à 500 Mo (archives : 1 Go de contenu) ;
# avec les valeurs par défaut, les gros fichiers seraient refusés ou survolés.
StreamMaxLength 500M
MaxFileSize 500M
MaxScanSize 1000M

# Mise à jour quotidienne des signatures : une seule base en mémoire à la fois
# (deux fois moins de mémoire ; les analyses attendent quelques secondes).
ConcurrentDatabaseReload no
