    # BlackStore : page claire pendant un redémarrage, au lieu de « 502 Bad Gateway »
    # (ajouté par docker/nginx/installer-pages-erreur.sh).
    error_page 502 503 504 =503 /_blackstore_maintenance.html;
    location = /_blackstore_maintenance.html {
        root /var/www/blackstore-erreurs;
        internal;
        add_header Cache-Control "no-store" always;
        add_header Retry-After "30" always;
    }

