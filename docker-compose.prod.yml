networks:
  blackstore-network:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  minio-data:
  files-storage:
  clamav-db:

services:
  nestjs-api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile.prod
    container_name: blackstore-api
    ports:
      - "127.0.0.1:3010:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks: [blackstore-network]
    restart: unless-stopped

  nextjs-storefront:
    build:
      context: ./apps/storefront
      dockerfile: Dockerfile.prod
    container_name: blackstore-storefront
    ports:
      - "127.0.0.1:3001:3001"
    environment:
      - API_URL=http://nestjs-api:3000
      - PORT=3001
    env_file:
      - .env.production
    depends_on:
      - nestjs-api
    networks: [blackstore-network]
    restart: unless-stopped

  react-admin:
    build:
      context: ./apps/admin
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ${VITE_API_URL}
    container_name: blackstore-admin
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - nestjs-api
    networks: [blackstore-network]
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: blackstore-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-blackstore}
      POSTGRES_USER: ${POSTGRES_USER:-blackstore}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackstore} -d ${POSTGRES_DB:-blackstore}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [blackstore-network]
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: blackstore-redis
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [blackstore-network]
    restart: unless-stopped

  minio:
    image: minio/minio
    container_name: blackstore-minio
    ports:
      - "127.0.0.1:9010:9000"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    command: server /data --console-address ":9001"
    networks: [blackstore-network]
    restart: unless-stopped

  # Antivirus des fichiers déposés par les vendeurs (démon clamd sur le port 3310, joignable
  # seulement depuis le réseau interne). Signatures mises à jour chaque jour par freshclam et
  # gardées dans le volume clamav-db. Prêt une trentaine de secondes après le démarrage.
  clamav:
    image: clamav/clamav:1.5
    container_name: blackstore-clamav
    volumes:
      - clamav-db:/var/lib/clamav
      - ./docker/clamav/clamd.conf:/etc/clamav/clamd.conf:ro
    mem_limit: 3g
    networks: [blackstore-network]
    restart: unless-stopped
