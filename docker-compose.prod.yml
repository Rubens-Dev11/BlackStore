# ─────────────────────────────────────────────────────────────────────
# BlackStore — Docker Compose Production Override
# ─────────────────────────────────────────────────────────────────────
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build
#
# Ce fichier surcharge docker-compose.yml pour la production :
# - Supprime les volumes de développement (hot-reload)
# - Utilise des builds multi-stage optimisés
# - Configure NODE_ENV=production
# - Désactive Swagger, MailHog, MinIO Console
# - Active les health checks stricts
# ─────────────────────────────────────────────────────────────────────

version: '3.9'

